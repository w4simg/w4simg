name: generate animation

on:
  # run automatically every 12 hours
  schedule:
    - cron: "0 */12 * * *" 
  
  # allows to manually run the job at any time
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # generates dragon/snake animation from github user contributions graph
      - name: generate dragon contribution animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: w4simg
          outputs: |
            dist/github-contribution-grid-dragon.svg?color_snake=#7b2cbf&color_dots=#ebedf0,#d8b4fe,#c084fc,#9333ea,#581c87
            dist/github-contribution-grid-dragon-dark.svg?palette=github-dark&color_snake=#c084fc&color_dots=#161b22,#3b0764,#581c87,#7e22ce,#a855f7
            dist/github-contribution-grid-snake.svg?color_snake=#7b2cbf&color_dots=#ebedf0,#d8b4fe,#c084fc,#9333ea,#581c87
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#c084fc&color_dots=#161b22,#3b0764,#581c87,#7e22ce,#a855f7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      # push the content of <build_dir> to the output branch
      - name: push to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
