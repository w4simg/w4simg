name: Update Profile Views

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-views:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TRAFFIC_TOKEN }}
          fetch-depth: 0

      - name: Generate views SVG
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          REPO: w4simg/w4simg
        run: |
          python3 .github/scripts/update_views.py

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/views.svg profile/views-count.json
          git diff --staged --quiet && echo "No changes" || (git commit -m "chore: update profile views" && git push)
